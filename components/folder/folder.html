<!--
  Usage snippet: Folder
  Purely decorative — no interactive behavior beyond CSS :hover (no JS needed).
  Hover the whole .folder element to see the three tags slide further out.
-->

<div class="folder">
  <div class="folder__back"></div>

  <div class="folder__tag folder__tag--mobile">
    <span class="folder__tag-label">mobile</span>
  </div>
  <div class="folder__tag folder__tag--web">
    <span class="folder__tag-label">web</span>
  </div>
  <div class="folder__tag folder__tag--media">
    <span class="folder__tag-label">media</span>
  </div>

  <div class="folder__front">
    <div class="folder__strip"></div>
    <div class="folder__strip"></div>
  </div>
</div>
