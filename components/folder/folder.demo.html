<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Folder — demo</title>
<link rel="stylesheet" href="../../tokens/index.css" />
<link rel="stylesheet" href="./folder.css" />
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-xl);
    background: var(--color-surface-background);
  }
  .demo-item { display: flex; flex-direction: column; align-items: center; gap: var(--space-l); }
  .demo-caption {
    font-family: var(--font-family-text);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-text-secondary);
  }
</style>
</head>
<body>
  <div class="demo-item">
    <span class="demo-caption">default</span>
    <div class="folder">
      <div class="folder__back"></div>
      <div class="folder__tag folder__tag--mobile"><span class="folder__tag-label">mobile</span></div>
      <div class="folder__tag folder__tag--web"><span class="folder__tag-label">web</span></div>
      <div class="folder__tag folder__tag--media"><span class="folder__tag-label">media</span></div>
      <div class="folder__front">
        <div class="folder__strip"></div>
        <div class="folder__strip"></div>
      </div>
    </div>
  </div>
  <div class="demo-item">
    <span class="demo-caption">hovering — наведи</span>
    <div class="folder">
      <div class="folder__back"></div>
      <div class="folder__tag folder__tag--mobile"><span class="folder__tag-label">mobile</span></div>
      <div class="folder__tag folder__tag--web"><span class="folder__tag-label">web</span></div>
      <div class="folder__tag folder__tag--media"><span class="folder__tag-label">media</span></div>
      <div class="folder__front">
        <div class="folder__strip"></div>
        <div class="folder__strip"></div>
      </div>
    </div>
  </div>
</body>
</html>
