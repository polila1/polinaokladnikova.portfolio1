<!--
  Usage snippet: Header nav item
  Default state — plain link.
  Hovering — real :hover, no extra class needed.
  Active state — add `header-nav-item--active` and `aria-current="page"` to the
  item that matches the current page.
-->

<a class="header-nav-item" href="#work">
  <span class="header-nav-item__label">Work</span>
</a>

<a class="header-nav-item header-nav-item--active" href="#work" aria-current="page">
  <span class="header-nav-item__label">Work</span>
</a>
